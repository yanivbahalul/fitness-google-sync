name: Train food model

# Trains the on-phone food classifier (Create ML, Food-101 subset) on a Mac and commits
# Sources/Food/FoodClassifier.mlmodel to the branch it ran on.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/food101/**"
      - ".github/workflows/train-food-model.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: macos-15
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Download Food-101
        run: |
          for i in 1 2 3; do
            curl -fL --retry 3 -o food-101.tar.gz http://data.vision.ee.ethz.ch/cvl/food-101.tar.gz && break
            sleep 20
          done
          tar xzf food-101.tar.gz

      - name: Make training subset
        run: python3 tools/food101/subset.py food-101 subset 200 40

      # Create ML's checkpoints from an earlier run of the same training code, so a run that
      # was stopped (timeout, crash) continues where it got to instead of starting over.
      - name: Restore saved training progress
        uses: actions/cache/restore@v4
        with:
          path: training-session
          key: food-session-${{ hashFiles('tools/food101/**') }}-${{ github.run_id }}
          restore-keys: food-session-${{ hashFiles('tools/food101/**') }}-

      - name: Train with Create ML
        # Shorter than the job timeout, so the progress is still saved when time runs out.
        timeout-minutes: 300
        run: |
          swiftc -O tools/food101/TrainFoodModel.swift -o train-food-model
          ./train-food-model subset Sources/Food/FoodClassifier.mlmodel training-session

      - name: Save training progress
        if: always() && hashFiles('training-session/**') != ''
        uses: actions/cache/save@v4
        with:
          path: training-session
          key: food-session-${{ hashFiles('tools/food101/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit the model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Food/FoodClassifier.mlmodel
          git commit -m "Add trained food classifier (Food-101 subset, Create ML)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
