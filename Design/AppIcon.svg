<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="google" x1="0.15" y1="1" x2="0.75" y2="0">
      <stop offset="0" stop-color="#3385FF"/>
      <stop offset="0.45" stop-color="#3B8CFF"/>
      <stop offset="0.75" stop-color="#05A9BF"/>
      <stop offset="1" stop-color="#12BF5F"/>
    </linearGradient>
    <linearGradient id="googleWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="apple" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FF6B8B"/>
      <stop offset="1" stop-color="#FF2D3F"/>
    </linearGradient>
    <path id="heart" d="M512 880 C 300 730, 140 595, 140 415 C 140 290, 235 195, 355 195 C 425 195, 485 230, 512 290 C 539 230, 599 195, 669 195 C 789 195, 884 290, 884 415 C 884 595, 724 730, 512 880 Z"/>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fff"/>
    </marker>
  </defs>
  <rect width="1024" height="1024" fill="#fff"/>
  <g clip-path="url(#left)"><use href="#heart" fill="url(#google)"/></g>
  <g clip-path="url(#right)"><use href="#heart" fill="url(#apple)"/></g>
  <!-- small warm accent on the Google half, echoing its multicolor style -->
  <g clip-path="url(#left)">
    <clipPath id="hc"><use href="#heart"/></clipPath>
    <circle cx="250" cy="300" r="120" fill="url(#googleWarm)" opacity="0.0"/>
  </g>
  <!-- seam -->
  <line x1="512" y1="250" x2="512" y2="900" stroke="#fff" stroke-width="14"/>
  <!-- sync arrows -->
  <g fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round">
    <path d="M 392 470 A 125 125 0 0 1 615 395" marker-end="url(#head)"/>
    <path d="M 632 560 A 125 125 0 0 1 409 635" marker-end="url(#head)"/>
  </g>
</svg>
