name: StepsBridge
options:
  bundleIdPrefix: com.yanivbahalul
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  StepsBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Config/Secrets.example.plist
    resources:
      - path: Sources/Config/Secrets.plist
        optional: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: StepsBridge
        CFBundleShortVersionString: "1.0"
        CFBundleVersionString: "1"
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "StepsBridge only manages the data it wrote itself, so re-syncing never creates duplicates."
        NSHealthUpdateUsageDescription: "StepsBridge writes your Google Health data (activity, heart, sleep, body measurements, workouts, nutrition) into Health."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_OAUTH_REDIRECT_SCHEME)
    entitlements:
      path: Sources/App/StepsBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanivbahalul.stepsbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GOOGLE_OAUTH_REDIRECT_SCHEME: com.googleusercontent.apps.84175655883-g6tnujthm7282dthp53sbljc4udstrqm
