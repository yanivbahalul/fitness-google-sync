name: StepsBridge
options:
  bundleIdPrefix: com.yanivbahalul
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  StepsBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Config/Secrets.example.plist
    resources:
      - path: Sources/Config/Secrets.plist
        optional: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: StepsBridge
        CFBundleShortVersionString: "1.0"
        CFBundleVersionString: "1"
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "StepsBridge reads your existing step data so it won't create duplicate entries when writing synced steps."
        NSHealthUpdateUsageDescription: "StepsBridge writes step counts pulled from your Google Health account into Health."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_OAUTH_REDIRECT_SCHEME)
    entitlements:
      path: Sources/App/StepsBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanivbahalul.stepsbridge
        GOOGLE_OAUTH_REDIRECT_SCHEME: com.googleusercontent.apps.84175655883-g6tnujthm7282dthp53sbljc4udstrqm
