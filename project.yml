name: StepsBridge
options:
  bundleIdPrefix: com.yanivbahalul
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  StepsBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Config/Secrets.example.plist
    resources:
      - path: Sources/Config/Secrets.plist
        optional: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: HealthBridge
        CFBundleShortVersionString: "1.0"
        CFBundleVersionString: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: "HealthBridge uses the camera to photograph meals and scan food barcodes."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.yanivbahalul.stepsbridge.refresh
        NSHealthShareUsageDescription: "HealthBridge only manages the data it wrote itself, so re-syncing never creates duplicates."
        NSHealthUpdateUsageDescription: "HealthBridge writes your Google Health data (activity, heart, sleep, body measurements, workouts, nutrition) into Health."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_OAUTH_REDIRECT_SCHEME)
    entitlements:
      path: Sources/App/StepsBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanivbahalul.stepsbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: P23HG4TNGU
        CODE_SIGN_STYLE: Automatic
        GOOGLE_OAUTH_REDIRECT_SCHEME: com.googleusercontent.apps.84175655883-g6tnujthm7282dthp53sbljc4udstrqm
